<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Controle de Serviços{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css?v=responsive-2">
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">CS</div>
        <div>
          <div class="brand-title">ofício</div>
          <div class="brand-sub">controle diário</div>
        </div>
      </div>

      <div class="nav-label">Operação</div>
      <nav class="nav">
        <a href="/" class="{{ 'active' if page == 'dashboard' }}">🏠 Visão geral</a>
        <a href="/funcionarios" class="{{ 'active' if page == 'funcionarios' }}">👥 Funcionários</a>
        <a href="/gastos" class="{{ 'active' if page == 'gastos' }}">🧾 Gastos</a>
        <a href="/registros" class="{{ 'active' if page == 'registros' }}">📋 Registros</a>
      </nav>

    </aside>

    <div class="main">
      <header class="topbar">
        <div>
          <div class="eyebrow">{{ today.strftime('%d/%m/%Y') if today }}</div>
          <h1>{% block page_title %}Visão geral{% endblock %}</h1>
        </div>
        <form method="post" action="/logout" class="topbar-logout">
          <button type="submit" class="logout-link">Sair da conta</button>
        </form>
      </header>
      <div class="content">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>

  <div id="confirm-modal" class="modal-backdrop" hidden>
    <section class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
      <div class="modal-icon">!</div>
      <div>
        <h2 id="confirm-title">Confirmar exclusão</h2>
        <p id="confirm-message">Esta ação não pode ser desfeita.</p>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="confirm-cancel">Cancelar</button>
        <button type="button" class="btn btn-danger" id="confirm-delete">Excluir</button>
      </div>
    </section>
  </div>

  <script>
    (() => {
      const modal = document.getElementById('confirm-modal');
      const message = document.getElementById('confirm-message');
      const cancel = document.getElementById('confirm-cancel');
      const confirm = document.getElementById('confirm-delete');
      let pendingForm = null;

      const closeModal = () => {
        modal.hidden = true;
        pendingForm = null;
      };

      document.querySelectorAll('form[data-confirm]').forEach((form) => {
        form.addEventListener('submit', (event) => {
          if (form.dataset.confirmed === 'true') return;
          event.preventDefault();
          pendingForm = form;
          message.textContent = form.dataset.confirm;
          modal.hidden = false;
          cancel.focus();
        });
      });

      cancel.addEventListener('click', closeModal);
      confirm.addEventListener('click', () => {
        if (!pendingForm) return;
        pendingForm.dataset.confirmed = 'true';
        pendingForm.submit();
      });
      modal.addEventListener('click', (event) => {
        if (event.target === modal) closeModal();
      });
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !modal.hidden) closeModal();
      });
    })();
  </script>
</body>
</html>
